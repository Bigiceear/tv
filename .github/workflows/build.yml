name: Build TV Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate icons automatically
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
        convert -size 512x512 xc:'#1a1a2e' \
          -fill '#667eea' -draw "roundrectangle 100,100 412,412 60,60" \
          -fill white -pointsize 120 -gravity center -annotate +0+0 "TV" \
          app/src/main/res/drawable/ic_launcher.png
        convert -size 320x180 xc:'#1a1a2e' \
          -fill '#667eea' -draw "roundrectangle 20,20 300,160 20,20" \
          -fill white -pointsize 36 -gravity center -annotate +0+0 "TV Browser" \
          app/src/main/res/drawable/banner.png

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TV-Browser-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
